site_name: Conf2Git Documentation
site_description: Automatically mirror Confluence spaces to GitHub as Markdown.
site_author: Magnascale
site_url: https://magnascale.github.io/conf2git-documentation/
repo_url: https://github.com/magnascale/conf2git-documentation
repo_name: Documentation source
edit_uri: ''
copyright: Copyright &copy; 2026 Magnascale Inc.
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/conf2git-logo.png
  favicon: assets/conf2git-logo.png
  custom_dir: overrides
  font: false
  palette:
    - media: '(prefers-color-scheme)'
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow system appearance
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Start here:
      - Home: index.md
      - Get started: getting-started.md
      - FAQ: faq.md
  - Configure and sync:
      - GitHub authorization: github-authorization.md
      - Synchronization and managed files: synchronization-and-managed-files.md
      - Synchronization schedules: synchronization-schedules.md
      - Conversion support: conversion-support.md
  - Security and limits:
      - Security and data flow: security-and-data-flow.md
      - Backup limitations: limitations.md
  - Help and recovery:
      - Troubleshooting: troubleshooting.md
      - Recovery and lifecycle: recovery-and-lifecycle.md
      - Contact support: https://magnascale.com/contact-us/

plugins:
  - search

markdown_extensions:
  - sane_lists
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 2-4

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://magnascale.com/
      name: Visit Magnascale
    - icon: fontawesome/solid/envelope
      link: https://magnascale.com/contact-us/
      name: Contact Magnascale support
